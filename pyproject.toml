[project]
name = "lambchat"
version = "2.15.2"
description = "Full-featured AI Agent system with FastAPI, LangGraph, and LangSmith"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    # Core
    "fastapi>=0.143.1",
    "uvicorn[standard]>=0.54.0",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.0",
    "python-multipart>=0.0.32",
    "Pillow>=12.3.0",
    # LangChain Ecosystem
    "langchain>=1.4.6",
    "langchain-core>=1.6.10",
    "langchain-openai>=1.7.2", # OpenAI integration for LangGraph/DeepAgent
    "langchain-mcp-adapters>=0.3.2", # MCP integration
    "langgraph>=1.2.15",
    "langsmith>=0.14.8",
    "deepagents>=0.7.25,<0.8", # 0.7 系列最新子代理与运行时修复
    "deepagents-backends>=0.2.0",
    "tiktoken>=0.14.0",
    # Async & Streaming
    "sse-starlette>=3.5.0",
    "httpx>=0.28.1",
    "aiohttp>=3.14.5",
    "aiofiles>=25.1.0",
    # Storage
    "redis>=5.3.1", # arq 0.28 requires redis<6
    "asyncpg>=0.32.0",
    "pymongo>=4.19.0",
    "langchain-mongodb>=0.12.1",
    "boto3>=1.40.61", # deepagents-backends -> aiobotocore 2.25.1
    "botocore>=1.40.61",
    # Utilities
    "python-dotenv>=1.2.4",
    "colorama>=0.4.6",
    "orjson>=3.13.0",
    "email-validator>=2.3.0",
    "resend>=2.49.1",
    "bcrypt>=5.0.0",
    "authlib>=1.9.1", # OAuth/OIDC support
    "cryptography>=50.0.2", # Independently signed daemon release verification
    "langgraph-checkpoint-mongodb>=0.5.1",
    "daytona>=0.224.1",
    "minio>=7.2.20",
    "oss2>=2.19.1",
    "langchain-anthropic>=1.7.6",
    "langchain-google-genai>=4.4.2",
    "langgraph-checkpoint-postgres>=3.2.0",
    # Memory
    "jieba>=0.42.1",
    "pypinyin>=0.55.0",
    "lark-oapi>=1.7.5",
    "e2b>=2.56.0",
    "cubesandbox>=0.7.3",
    "psutil>=7.2.2",
    "apscheduler>=3.11.3",
    "langchain-quickjs>=0.3.9",
    "arq>=0.28.0",
    "pywebpush>=2.5.0",
    "qdrant-client>=1.19.1",
    "pypdfium2>=5.14.0",
    "openpyxl>=3.1.5",
    "langfuse>=5.0.1",
    "trafilatura>=2.3.1",
    "markitdown[docx,pdf,pptx]>=0.1.8",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.0",
    "mypy>=2.4.0",
    "types-PyYAML>=6.0.12.20260906",
    "pre-commit>=4.7.0",
    "pyinstaller>=6.22.3",
]
# computer-use 后端（仅 daemon 打包时同步：`uv sync --group cua`）。
# 平台标记互斥，各自只在对应构建机上落地：
# - macOS: atomacos（Apple AX API，经 PyObjC；附带 pyautogui/pyscreeze 事件与截屏）
# - Windows: pywinauto（UIA）+ pyautogui（键鼠/截屏，Windows 下零额外系统依赖）
# - Linux: 系统包 python3-pyatspi（pip 无可靠发行，apt/dnf 安装）+ pyautogui（X11）
cua = [
    "atomacos>=3.3.0; sys_platform == 'darwin'",
    "pywinauto>=0.6.9; sys_platform == 'win32'",
    "pyautogui>=0.9.54; sys_platform != 'darwin'",
    "python-xlib>=0.33; sys_platform == 'linux'",
    "pillow>=12.3.0",
    # 非 ASCII 文本输入的剪贴板通道(cua_ops._type_text);缺失时中文
    # 输入整链 dispatch_failed(2026-10-08 生产实测)
    "pyperclip>=1.11.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agents", "src/api", "src/infra", "src/kernel"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = [".", "client"]
exclude = ["verify_setup.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E402"]
"tests/*" = ["E402", "F841"]
"src/kernel/config.py" = ["F821"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_return_any = false
warn_unused_ignores = false
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = [".", "client"]

[tool.uv]
# atomacos and binary-only ONNX Runtime need separate macOS architecture resolutions.
# Intel macOS has no ONNX Runtime wheel for Python 3.14; native clients use Python 3.12.
environments = [
    "sys_platform == 'darwin' and platform_machine == 'x86_64' and python_version < '3.14'",
    "sys_platform == 'darwin' and platform_machine != 'x86_64'",
    "sys_platform != 'darwin'",
]
# The native Intel client builds with Python 3.12; reject binary-only dependencies without its wheel.
required-environments = ["sys_platform == 'darwin' and platform_machine == 'x86_64'"]
# 官方 PyPI：CI（GitHub 海外 runner）直连官方源。此前 uv.lock 历史遗留
# 腾讯镜像 URL，国内镜像抖动会随机打断 CI（依赖下载超时）。本地如需镜像
# 加速，用 UV_DEFAULT_INDEX 环境变量临时覆盖，但提交 lock 前保持官方源。
# 注意：default-index 不是 [tool.uv] 合法字段（uv 会静默忽略），必须用
# [[tool.uv.index]] 且 default = true，才能压过用户级 uv.toml 的镜像配置。
[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true
