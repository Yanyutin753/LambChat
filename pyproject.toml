[project]
name = "lambchat"
version = "2.8.0"
description = "Full-featured AI Agent system with FastAPI, LangGraph, and LangSmith"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Core
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.4",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "python-multipart>=0.0.32",
    "Pillow>=12.3.0",
    # LangChain Ecosystem
    "langchain>=1.3.18",
    "langchain-core>=1.6.1",
    "langchain-openai>=1.6.0", # OpenAI integration for LangGraph/DeepAgent
    "langchain-mcp-adapters>=0.3.2", # MCP integration
    "langgraph>=1.2.11",
    "langsmith>=0.11.2",
    "deepagents>=0.7.11,<0.8",
    "deepagents-backends>=0.2.0",
    "tiktoken>=0.14.0",
    # Async & Streaming
    "sse-starlette>=3.4.8",
    "httpx>=0.28.1",
    "aiofiles>=25.1.0",
    # Storage
    "redis>=5.3.1",
    "asyncpg>=0.31.0",
    "pymongo>=4.16.0",
    "langchain-mongodb>=0.12.0",
    "boto3>=1.40.61",
    "botocore>=1.40.61",
    # Utilities
    "python-dotenv>=1.2.3",
    "colorama>=0.4.6",
    "orjson>=3.12.0",
    "email-validator>=2.3.0",
    "resend>=2.42.0",
    "bcrypt>=5.0.0",
    "authlib>=1.7.2", # OAuth/OIDC support
    "motor>=3.7.1",
    "langgraph-checkpoint-mongodb>=0.4.0",
    "daytona>=0.207.0",
    "minio>=7.2.20",
    "oss2>=2.19.1",
    "langchain-anthropic>=1.7.0",
    "langchain-google-genai>=4.3.7",
    "langgraph-checkpoint-postgres>=3.1.2",
    # Memory
    "jieba>=0.42.1",
    "pypinyin>=0.55.0",
    "lark-oapi>=1.6.9,<1.7",
    "e2b>=2.46.0",
    "cubesandbox>=0.7.0",
    "psutil>=7.2.2",
    "apscheduler>=3.11.3",
    "langchain-quickjs>=0.3.5",
    "arq>=0.28.0",
    "pywebpush>=2.5.0",
    "qdrant-client>=1.19",
    "pypdfium2>=5.13.0",
    "openpyxl>=3.1.5",
    "langfuse>=3.0.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.5",
    "mypy>=2.3.1",
    "types-PyYAML>=6.0.12.20260815",
    "pre-commit>=4.6.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agents", "src/api", "src/infra", "src/kernel"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["verify_setup.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E402"]
"tests/*" = ["E402", "F841"]
"src/kernel/config.py" = ["F821"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_return_any = false
warn_unused_ignores = false
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
