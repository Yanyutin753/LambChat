[package]
name = "lambchat"
version = "2.15.2"
description = "LambChat desktop app"
authors = ["LambChat"]
license = ""
repository = ""
edition = "2021"

[lib]
name = "lambchat_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
tauri = { version = "2.12.4", features = ["tray-icon"] }
# NPM 侧同名包须保持相同 major.minor（tauri build 启动校验，不一致直接报错）
tauri-plugin-notification = "2.7.0"
tauri-plugin-updater = "2.14.0"
tauri-plugin-process = "2.4.0"
tauri-plugin-shell = "2.5.0"
tauri-plugin-opener = "2.7.2"
# 设置页"沙箱数据位置"目录选择（原生对话框）
tauri-plugin-dialog = "2.8.3"
# 跨启动记住主窗口位置/大小
tauri-plugin-window-state = "2.5.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
uuid = { version = "1.28.0", features = ["v4"] }
# Linux deb/rpm 更新安装的流式下载（linux_update.rs）。与 updater 插件共用
# 同版本 reqwest；TLS provider 不自带（rustls-no-provider）——由下方 rustls(ring)
# 在进程级安装，避免引入 aws-lc-sys 原生构建（reqwest `rustls` feature 的默认）
reqwest = { version = "0.13.5", default-features = false, features = ["stream", "rustls-no-provider"] }
# 声明与 updater 插件完全一致（版本/feature 取并集，lock 零新增），
# 供 linux_update 安装进程级 ring provider
ring = "0.17.14"
rustls = { version = "0.23.46", default-features = false, features = ["ring"] }
# 托盘菜单文案按系统 locale 五语本地化（M4 T8）；无传递依赖，纯 Rust 读 env/API
sys-locale = "0.3.2"
command-group = "5.0.1"

[target.'cfg(unix)'.dependencies]
# daemon sidecar 探活轮询用 kill(pid, 0)（存在性校验，不发实际信号）
libc = "0.2.190"

[target.'cfg(target_os = "macos")'.dependencies]
# AppKit types already used by Tauri; no extra window-decoration plugin.
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSWindow", "NSView", "NSButton", "NSResponder"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSNotification", "NSOperation", "NSString", "NSDictionary", "NSError", "NSProcessInfo", "block2"] }
block2 = "0.6.2"

[target.'cfg(target_os = "windows")'.dependencies]
# WinRT bindings for real toast activation callbacks.
windows = { version = "0.62.2", features = ["Foundation", "UI_Notifications", "Data_Xml_Dom"] }
