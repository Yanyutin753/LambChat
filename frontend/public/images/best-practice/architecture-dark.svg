<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1032" viewBox="0 0 1440 1032" role="img" aria-labelledby="title desc"><title id="title">LambChat system architecture</title><desc id="desc">Clients connect to FastAPI. Quick, Search and Team agents use shared memory, skills, tools, approvals and goals. Model providers, MCP tools, cloud and local sandboxes integrate with the runtime. MongoDB, Redis, optional PostgreSQL checkpoints and file storage support local or arq task execution, scheduled jobs, notifications, sharing and tracing.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a4ba90"/></marker></defs><rect width="1440" height="1032" fill="#151718"/>
