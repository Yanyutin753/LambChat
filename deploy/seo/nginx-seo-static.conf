# ========================================
# SEO static content — 2026-08-27
# /docs/     VitePress docs (en/zh), cleanUrls -> .html fallback
# /features  marketing landing (exact match)
# 删除本文件并 reload 即可回退（后端 / 兜底不受影响）
# ========================================

location = /docs {
    return 301 /docs/;
}

location ^~ /docs/assets/ {
    root /www/sites/lambchat.com;
    access_log off;
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
}

location ^~ /docs/ {
    root /www/sites/lambchat.com;
    index index.html;
    try_files $uri $uri.html $uri/ =404;
    add_header Cache-Control "no-cache";
    error_page 404 /docs/404.html;
}

location = /features {
    alias /www/sites/lambchat.com/features/index.html;
    default_type text/html;
    add_header Cache-Control "no-cache";
}

location = /features/hero.webp {
    alias /www/sites/lambchat.com/features/hero.webp;
    default_type image/webp;
    access_log off;
    expires 30d;
}
