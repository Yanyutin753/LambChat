name: Lint

on:
  push:
    branches: [main, develop]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/test_windows_installer_hooks.ps1'
      - 'scripts/pytest_shard.py'
      - 'scripts/run_validation.py'
      - 'scripts/run-validation.mjs'
      - 'frontend/**'
      - 'docs/**'
      - '*.md'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.pre-commit-config.yaml'
      - '.github/workflows/lint.yml'
      - 'main.py'
      - 'run.py'
  pull_request:
    branches: [main, develop]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/test_windows_installer_hooks.ps1'
      - 'scripts/pytest_shard.py'
      - 'scripts/run_validation.py'
      - 'scripts/run-validation.mjs'
      - 'frontend/**'
      - 'docs/**'
      - '*.md'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.pre-commit-config.yaml'
      - '.github/workflows/lint.yml'
      - 'main.py'
      - 'run.py'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Python formatting and linting with ruff
  ruff:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        env:
          # uv.lock pins a CN mirror (fastest locally); GH-hosted runners
          # pull from it fine but throttle under uv's 50 parallel downloads.
          UV_CONCURRENT_DOWNLOADS: "8"
        run: uv sync --group dev || (sleep 15 && uv sync --group dev)

      - name: Run Ruff check
        run: uv run ruff check .

      - name: Run Ruff format
        run: uv run ruff format --check .

  # Type checking for backend
  mypy:
    name: MyPy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        env:
          # uv.lock pins a CN mirror (fastest locally); GH-hosted runners
          # pull from it fine but throttle under uv's 50 parallel downloads.
          UV_CONCURRENT_DOWNLOADS: "8"
        run: uv sync --group dev || (sleep 15 && uv sync --group dev)

      - name: Restore MyPy cache
        uses: actions/cache@v4
        with:
          path: .mypy_cache
          key: mypy-${{ runner.os }}-${{ hashFiles('uv.lock', 'pyproject.toml') }}-${{ github.sha }}
          restore-keys: mypy-${{ runner.os }}-${{ hashFiles('uv.lock', 'pyproject.toml') }}-

      - name: Run MyPy
        run: uv run mypy src/

  # Each shard has its own runner and Redis; each pytest process stays serial.
  backend-test-shards:
    name: Backend Tests (Shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    services:
      # 队列 Lua 脚本等集成测试需要真实 Redis（不可达时测试自动 skip）
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        env:
          # uv.lock pins a CN mirror (fastest locally); GH-hosted runners
          # pull from it fine but throttle under uv's 50 parallel downloads.
          UV_CONCURRENT_DOWNLOADS: "8"
        run: uv sync --group dev || (sleep 15 && uv sync --group dev)

      - name: Run backend tests
        run: uv run python -m pytest -p scripts.pytest_shard --shard=${{ matrix.shard }}/4

  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    needs: [backend-test-shards]
    if: ${{ always() }}
    steps:
      - name: Require every backend shard to pass
        env:
          BACKEND_TEST_RESULT: ${{ needs.backend-test-shards.result }}
        run: test "$BACKEND_TEST_RESULT" = success

  # Prevent bulky generated artifacts and oversized source files
  large-files:
    name: Large File Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check tracked file sizes
        shell: bash
        run: |
          max_bytes=$((5 * 1024 * 1024))
          failed=0
          while IFS= read -r -d '' file; do
            # Bundled font assets (CJK cover rendering) are legitimately large
            case "$file" in
              *.ttf|*.ttc|*.otf) continue ;;
            esac
            size=$(wc -c < "$file")
            if [ "$size" -gt "$max_bytes" ]; then
              printf 'Tracked file exceeds 5 MiB: %s (%s bytes)\n' "$file" "$size"
              failed=1
            fi
          done < <(git ls-files -z)
          exit "$failed"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: frontend

      - name: Check files over 1500 lines
        run: pnpm run find-large-files
        working-directory: frontend

  # Lint for frontend
  eslint:
    name: ESLint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: frontend

      - name: Run ESLint
        run: pnpm run lint
        working-directory: frontend

  # Separate runners keep file isolation and the single-worker limit.
  frontend-test-shards:
    name: Frontend Tests (Shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: frontend

      - name: Run frontend tests
        run: pnpm test --shard=${{ matrix.shard }}/4
        working-directory: frontend

  # Preserve the required check name and reject failed, skipped or cancelled shards.
  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest
    needs: [frontend-test-shards]
    if: ${{ always() }}
    steps:
      - name: Require every frontend shard to pass
        env:
          FRONTEND_TEST_RESULT: ${{ needs.frontend-test-shards.result }}
        run: test "$FRONTEND_TEST_RESULT" = success

  windows-file-transfers:
    name: Windows File Transfers
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatin/rust-cache@v2
        with:
          workspaces: frontend/src-tauri -> target
          shared-key: windows-file-transfers
      - name: Prepare unit-test web assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force frontend/.ci-native-fixture | Out-Null
          Set-Content frontend/.ci-native-fixture/index.html '<!doctype html><title>Native unit tests</title>'
      - name: Compile Windows bridge and test native file boundaries
        shell: pwsh
        env:
          TAURI_CONFIG: '{"build":{"frontendDist":"../.ci-native-fixture"},"bundle":{"externalBin":[],"resources":[],"icon":["../public/favicon.ico"]}}'
        run: |
          python scripts/run_validation.py cargo test --locked --manifest-path frontend/src-tauri/Cargo.toml -j1 --lib -- --test-threads=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  windows-installer-hooks:
    name: Windows Installer Hooks
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify automatic upgrade and reinstall
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'nsis-3.11.zip'
          Invoke-WebRequest 'https://github.com/tauri-apps/binary-releases/releases/download/nsis-3.11/nsis-3.11.zip' -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA1).Hash -ne 'EF7FF767E5CBD9EDD22ADD3A32C9B8F4500BB10D') { throw 'NSIS archive hash mismatch' }
          $directory = Join-Path $env:RUNNER_TEMP 'nsis-toolchain'
          Expand-Archive $archive $directory
          $compiler = Get-ChildItem $directory -Filter makensis.exe -Recurse | Select-Object -First 1
          if (-not $compiler) { throw 'NSIS compiler missing' }
          ./scripts/test_windows_installer_hooks.ps1 -MakeNsis $compiler.FullName
