name: App Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to create or update, for example v2.5.0-app. Ignored for tag pushes.'
        required: true
        type: string
      app_url:
        description: 'Public LambChat URL. Falls back to repo variable/secret LAMBCHAT_APP_URL.'
        required: false
        type: string

permissions:
  contents: write

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '10.32.1'
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
  LAMBCHAT_APP_URL: ${{ inputs.app_url || vars.LAMBCHAT_APP_URL || secrets.LAMBCHAT_APP_URL }}

jobs:
  desktop:
    name: Desktop (${{ matrix.label }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
      # pbs_platform：fetch-pbs.py 的 --platform 取值（内嵌 Python 运行时
      # 归档按平台落 resources/python/<tag>/，与 daemon 平台一一对应）
      # updater_*：即发即传时增量合并 latest.json 的平台条目（macOS 走
      # .app.tar.gz updater 产物，dmg 仅用于首装不分发更新）
          - label: Linux x86_64
            runner: ubuntu-latest
            bundles: appimage,deb,rpm
            artifact_slug: linux-x86_64
            arch: x86_64
            pbs_platform: linux-x86_64
            updater_key: linux-x86_64
            updater_sig: "*_amd64.AppImage.sig"
            updater_asset_suffix: Linux-x86_64.AppImage
          - label: Linux ARM64
            runner: ubuntu-24.04-arm
            bundles: appimage,deb,rpm
            artifact_slug: linux-arm64
            arch: arm64
            pbs_platform: linux-aarch64
            updater_key: linux-aarch64
            updater_sig: "*_aarch64.AppImage.sig"
            updater_asset_suffix: Linux-arm64.AppImage
          - label: Windows
            runner: windows-2022
            bundles: msi
            artifact_slug: windows
            pbs_platform: windows-x86_64
            updater_key: windows-x86_64
            updater_sig: "*_x64_en-US.msi.sig"
            updater_asset_suffix: Windows.msi
          # M4 裁决：macOS 先 arm64 单架构（macos-14 原生），universal + lipo 属 M5
          - label: macOS
            runner: macos-14
            bundles: dmg,app
            artifact_slug: macos
            target: aarch64-apple-darwin
            pbs_platform: macos-arm64
            updater_key: darwin-aarch64
            updater_sig: "*.app.tar.gz.sig"
            updater_asset_suffix: macOS.app.tar.gz

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 版本漂移曾导致 v2.8.2 release 的 latest.json 写入 2.8.1、桌面端永远
      # 检测不到更新：tag 与各端版本文件不一致时立即失败，而不是静默产出
      # 错误清单。
      - name: Preflight version consistency
        shell: bash
        run: |
          set -euo pipefail
          tag="${RELEASE_TAG#v}"
          pkg="$(node -p 'require("./frontend/package.json").version')"
          tauri="$(node -p 'JSON.parse(require("fs").readFileSync("frontend/src-tauri/tauri.conf.json","utf8")).version')"
          gradle_name="$(grep -E '^\s+versionName' frontend/android/app/build.gradle | sed -E 's/.*versionName "([^"]+)".*/\1/')"
          gradle_code="$(grep -E '^\s+versionCode' frontend/android/app/build.gradle | sed -E 's/.*versionCode ([0-9]+).*/\1/')"
          ios="$(grep -m1 'MARKETING_VERSION' frontend/ios/App/App.xcodeproj/project.pbxproj | sed -E 's/.*= ([^;]+);.*/\1/')"
          want_code="$(printf '%s' "$tag" | tr -d '.')"
          fail=0
          for entry in "frontend/package.json=$pkg" "tauri.conf.json=$tauri" "android versionName=$gradle_name" "iOS MARKETING_VERSION=$ios"; do
            k="${entry%%=*}"; v="${entry#*=}"
            if [ "$v" != "$tag" ]; then echo "✗ $k is $v, expected $tag"; fail=1; fi
          done
          if [ "$gradle_code" != "$want_code" ]; then
            echo "✗ android versionCode is $gradle_code, expected $want_code (digits of $tag)"; fail=1
          fi
          if [ "$fail" != 0 ]; then
            echo "Version drift detected: bump ALL platform version files before tagging $RELEASE_TAG"
            exit 1
          fi
          echo "All platform versions match $tag"

      - name: Validate app URL (optional)
        # app_url 可选：提供则构建期烘焙为默认服务器（VITE_API_BASE）；
        # 缺省打「运行时配置」包——安装后首启设置屏填 base_url 即可用。
        shell: bash
        run: |
          if [ -n "$LAMBCHAT_APP_URL" ]; then
            case "$LAMBCHAT_APP_URL" in
              https://*) ;;
              *) echo "LAMBCHAT_APP_URL must be an https:// URL"; exit 1 ;;
            esac
          else
            echo "LAMBCHAT_APP_URL not set: building runtime-configured package (first-run setup)"
          fi

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          # xdg-utils：tauri deb 打包要拷贝 /usr/bin/xdg-open 入包；x86_64 官方
          # 镜像预装、ubuntu-24.04-arm 不带（缺失时 deb bundle 直接失败）
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            file \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            rpm \
            xdg-utils

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add macOS Rust target
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
        working-directory: frontend

      - name: Verify LambChat native brand assets
        run: pnpm brand:assets:check
        working-directory: frontend

      - name: Shorten Windows package cache paths
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          pnpm config set store-dir D:\pnpm-store
          "npm_config_cache=D:\npm-cache" | Out-File -FilePath $env:GITHUB_ENV -Append
          "TEMP=D:\temp" | Out-File -FilePath $env:GITHUB_ENV -Append
          "TMP=D:\temp" | Out-File -FilePath $env:GITHUB_ENV -Append
          New-Item -ItemType Directory -Force D:\pnpm-store,D:\npm-cache,D:\temp | Out-Null

      # M4：daemon sidecar（PyInstaller onefile → binaries/lambchat-daemon-<triple>，
      # Windows 为 <triple>.exe）三平台同链路。externalBin 声明了该产物且
      # binaries/ 被 gitignore，缺此步 Tauri 打包必败。直调 build-daemon.sh
      # 而非 make client-build-daemon：windows-2022 镜像不预装 GNU make。
      # uv 安装方式与 lint.yml 保持一致。
      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install 3.12

      - name: Build sandbox daemon sidecar (PyInstaller)
        shell: bash
        env:
          # uv.lock pins a CN mirror; GH-hosted runners throttle under
          # uv's 50 parallel downloads (same mitigation as lint.yml).
          UV_CONCURRENT_DOWNLOADS: "8"
        run: |
          uv sync --group dev || (sleep 15 && uv sync --group dev)
          bash client/scripts/build-daemon.sh

      # M4：内嵌 Python 运行时（python-build-standalone install_only 归档，
      # ~111MB/平台）落到 tauri resources 约定位置，使 bundle.resources 有货。
      # tar.gz 由 daemon 首启解压（lambchat_sandbox.pbs.ensure_runtime）。
      # 产物体积大且随 PBS_TAG 锁定可复现，CI 缓存后加（本任务不做）。
      - name: Fetch embedded Python runtime (PBS)
        shell: bash
        run: uv run python client/scripts/fetch-pbs.py --platform ${{ matrix.pbs_platform }}

      - name: Build desktop package with Tauri
        env:
          TAURI_BUNDLES: ${{ matrix.bundles }}
          TAURI_TARGET: ${{ matrix.target || '' }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          CARGO_BUILD_JOBS: 1
        run: pnpm package:desktop
        working-directory: frontend

      # macOS 签名门禁：v2.8.4 及更早的 .app 没有 bundle 封印（无
      # _CodeSignature/CodeResources，Tauri 无 signingIdentity 时跳过签名），
      # 浏览器下载带隔离标记后被 Gatekeeper 判「已损坏」。signingIdentity "-"
      # 已让 Tauri 在产出 dmg/updater 产物前 ad-hoc 封印 bundle；本步验证
      # 封印与嵌套可执行签名（arm64 内核要求全部可执行代码至少 ad-hoc 签名，
      # daemon sidecar 缺签名会被 SIGKILL），防回归。
      - name: Verify macOS ad-hoc code signing
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          app_path="$(find frontend/src-tauri/target -path '*/release/bundle/macos/*.app' -type d | head -1)"
          if [ -z "$app_path" ]; then
            echo "No .app bundle found to verify"
            exit 1
          fi
          echo "Verifying bundle seal: $app_path"
          test -f "$app_path/Contents/_CodeSignature/CodeResources"
          codesign --verify --deep --strict --verbose=2 "$app_path"
          # 嵌套可执行（daemon sidecar）逐一验证
          while IFS= read -r -d '' bin; do
            echo "Verifying nested executable: $bin"
            codesign --verify --verbose=2 "$bin"
          done < <(find "$app_path/Contents/MacOS" -type f -perm -111 -print0)
          echo "OK: .app sealed (ad-hoc) and all nested executables signed"

      - name: Collect Linux desktop artifacts
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          arch="${{ matrix.arch }}"
          bundle_dir="frontend/src-tauri/target/release/bundle"
          appimage="$(find "$bundle_dir" -name '*.AppImage' -type f | head -1 || true)"
          deb="$(find "$bundle_dir" -name '*.deb' -type f | head -1 || true)"
          rpm="$(find "$bundle_dir" -name '*.rpm' -type f | head -1 || true)"
          found=false
          if [ -n "$appimage" ]; then
            cp "$appimage" "release-assets/LambChat-${RELEASE_TAG}-Linux-${arch}.AppImage"
            found=true
          fi
          if [ -n "$deb" ]; then
            cp "$deb" "release-assets/LambChat-${RELEASE_TAG}-Linux-${arch}.deb"
            found=true
          fi
          if [ -n "$rpm" ]; then
            cp "$rpm" "release-assets/LambChat-${RELEASE_TAG}-Linux-${arch}.rpm"
            found=true
          fi
          if [ "$found" != true ]; then
            echo "No Linux desktop artifacts found"
            exit 1
          fi
          # daemon sidecar 资产：保留 triple 原名（selfupdate 按 lambchat-daemon-<triple> 前缀匹配）
          cp frontend/src-tauri/binaries/lambchat-daemon-* release-assets/

      - name: Collect Windows desktop artifacts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          $msi = Get-ChildItem -Path 'frontend/src-tauri/target/release/bundle' -Recurse -Include *.msi -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($null -eq $msi) {
            throw 'No Windows MSI installer found'
          }
          Copy-Item $msi.FullName "release-assets/LambChat-$env:RELEASE_TAG-Windows.msi"

          $exeCandidates = @(
            'frontend/src-tauri/target/release/lambchat.exe',
            'frontend/src-tauri/target/x86_64-pc-windows-msvc/release/lambchat.exe'
          )
          $exePath = $exeCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if ($null -eq $exePath) {
            throw 'No Windows portable exe found'
          }
          $portableDir = 'release-assets/LambChat-Portable'
          New-Item -ItemType Directory -Force -Path $portableDir | Out-Null
          Copy-Item $exePath $portableDir
          Set-Content -Path (Join-Path $portableDir 'portable.ini') -Value @(
            '# LambChat portable build marker',
            'portable=true'
          ) -Encoding UTF8
          Compress-Archive -Path "$portableDir/*" -DestinationPath "release-assets/LambChat-$env:RELEASE_TAG-Windows-Portable.zip" -Force
          Remove-Item -Recurse -Force $portableDir
          # daemon sidecar 资产：保留 triple 原名（selfupdate 按 lambchat-daemon-<triple> 前缀匹配）
          Copy-Item 'frontend/src-tauri/binaries/lambchat-daemon-*.exe' 'release-assets/'

      - name: Collect macOS desktop artifacts
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          bundle_root="frontend/src-tauri/target"
          app_path=""
          dmg_path=""
          if [ -d "$bundle_root" ]; then
            app_path="$(find "$bundle_root" -path '*/release/bundle/*' -name '*.app' -type d | sort | head -1 || true)"
            dmg_path="$(find "$bundle_root" -path '*/release/bundle/*' -name '*.dmg' -type f | sort | head -1 || true)"
          fi
          if [ -z "$dmg_path" ]; then
            echo "No macOS .dmg found"
            find "$bundle_root" -maxdepth 6 -print || true
            exit 1
          fi
          if [ -n "$app_path" ]; then
            ditto -c -k --sequesterRsrc --keepParent "$app_path" "release-assets/LambChat-${RELEASE_TAG}-macOS.zip"
          else
            echo "No macOS .app bundle found; uploading DMG only."
          fi
          cp "$dmg_path" "release-assets/LambChat-${RELEASE_TAG}-macOS.dmg"
          # Tauri updater 的 macOS 产物（createUpdaterArtifacts + 签名密钥）。
          # 缺失会让 darwin-aarch64 条目被静默略过、mac 永远收不到更新，
          # 因此这里直接失败而不是跳过。
          app_tgz="$(find "$bundle_root" -path '*/release/bundle/*' -name '*.app.tar.gz' -type f | sort | head -1 || true)"
          if [ -z "$app_tgz" ]; then
            echo "No macOS .app.tar.gz updater artifact found (requires TAURI_SIGNING_PRIVATE_KEY)"
            exit 1
          fi
          cp "$app_tgz" "release-assets/LambChat-${RELEASE_TAG}-macOS.app.tar.gz"
          # daemon sidecar 资产：保留 triple 原名（selfupdate 按 lambchat-daemon-<triple> 前缀匹配）
          cp frontend/src-tauri/binaries/lambchat-daemon-* release-assets/

      - name: Collect updater manifest artifacts
        shell: bash
        run: |
          set -euo pipefail
          find frontend/src-tauri/target -name "latest*.json" -exec cp {} release-assets/ \; 2>/dev/null || true
          find frontend/src-tauri/target -name "*.sig" -exec cp {} release-assets/ \; 2>/dev/null || true
          ls -la release-assets/ 2>/dev/null || true

      - name: Upload desktop artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LambChat-${{ matrix.artifact_slug }}-${{ env.RELEASE_TAG }}
          path: release-assets/*
          if-no-files-found: error

      # 即发即传：本平台构建完成立即上传 Release，不等六端汇总。多 job 并发
      # 创建同一 Release 的竞态用「已存在即跳过 + 退避重试」收敛；重跑同一
      # tag 时 --clobber 原地替换同名资产。
      - name: Publish desktop assets to release immediately
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for delay in 0 5 15; do
            if [ "$delay" -gt 0 ]; then sleep "$delay"; fi
            if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              break
            fi
            if gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" --title "LambChat $RELEASE_TAG" \
              --generate-notes >/dev/null 2>&1; then
              break
            fi
          done
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null
          gh release upload "$RELEASE_TAG" release-assets/* --clobber --repo "$GITHUB_REPOSITORY"

      # latest.json 增量合并：本平台 sig 就绪即把平台条目并入已发布的
      # latest.json（下载-合并-上传）。并发读合写的丢条目竞态由汇总 job 的
      # 权威重生成兜底。node 合并：三平台镜像都装了 Node，规避 Windows 无
      # python3 的可执行名差异。
      - name: Merge updater platform entry into latest.json
        if: matrix.updater_key != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          UPDATER_KEY: ${{ matrix.updater_key }}
          UPDATER_SIG: ${{ matrix.updater_sig }}
          UPDATER_ASSET_SUFFIX: ${{ matrix.updater_asset_suffix }}
        run: |
          set -euo pipefail
          sig_file="$(compgen -G "release-assets/$UPDATER_SIG" | head -1 || true)"
          if [ -z "$sig_file" ]; then
            echo "No sig matches $UPDATER_SIG; skip latest.json merge"
            exit 0
          fi
          export SIG_FILE="$sig_file"
          rm -f latest.json
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern latest.json --dir . >/dev/null 2>&1 || true
          node -e '
            const fs = require("fs");
            const key = process.env.UPDATER_KEY;
            const signature = fs.readFileSync(process.env.SIG_FILE, "utf8").trim();
            const asset = `LambChat-${process.env.RELEASE_TAG}-${process.env.UPDATER_ASSET_SUFFIX}`;
            const base = `https://github.com/${process.env.GITHUB_REPOSITORY}/releases/download/${process.env.RELEASE_TAG}`;
            let manifest = {};
            if (fs.existsSync("latest.json")) {
              try { manifest = JSON.parse(fs.readFileSync("latest.json", "utf8")); } catch {}
            }
            manifest.platforms = manifest.platforms || {};
            manifest.platforms[key] = { signature, url: `${base}/${asset}` };
            // 版本必须取自 tag：v2.8.2 发布时 tauri.conf.json 仍写 2.8.1，
            // 导致 latest.json 报 2.8.1、桌面端永远检测不到更新。
            manifest.version = process.env.RELEASE_TAG.replace(/^v/, "");
            manifest.notes = `LambChat ${process.env.RELEASE_TAG}`;
            manifest.pub_date = new Date().toISOString().replace(/\.\d+Z$/, "Z");
            fs.writeFileSync("latest.json", JSON.stringify(manifest, null, 2));
            console.log("latest.json platforms:", Object.keys(manifest.platforms).sort().join(", "));
          '
          gh release upload "$RELEASE_TAG" latest.json --clobber --repo "$GITHUB_REPOSITORY"

  android:
    name: Android
    runs-on: ubuntu-latest
    outputs:
      has_artifact: ${{ steps.android-artifact.outputs.has_artifact }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 同 desktop job：版本漂移在打包前拦截（v2.8.2 的 APK versionName 仍
      # 写 2.8.1 就是这类漂移）
      - name: Preflight version consistency
        shell: bash
        run: |
          set -euo pipefail
          tag="${RELEASE_TAG#v}"
          pkg="$(node -p 'require("./frontend/package.json").version')"
          tauri="$(node -p 'JSON.parse(require("fs").readFileSync("frontend/src-tauri/tauri.conf.json","utf8")).version')"
          gradle_name="$(grep -E '^\s+versionName' frontend/android/app/build.gradle | sed -E 's/.*versionName "([^"]+)".*/\1/')"
          gradle_code="$(grep -E '^\s+versionCode' frontend/android/app/build.gradle | sed -E 's/.*versionCode ([0-9]+).*/\1/')"
          ios="$(grep -m1 'MARKETING_VERSION' frontend/ios/App/App.xcodeproj/project.pbxproj | sed -E 's/.*= ([^;]+);.*/\1/')"
          want_code="$(printf '%s' "$tag" | tr -d '.')"
          fail=0
          for entry in "frontend/package.json=$pkg" "tauri.conf.json=$tauri" "android versionName=$gradle_name" "iOS MARKETING_VERSION=$ios"; do
            k="${entry%%=*}"; v="${entry#*=}"
            if [ "$v" != "$tag" ]; then echo "✗ $k is $v, expected $tag"; fail=1; fi
          done
          if [ "$gradle_code" != "$want_code" ]; then
            echo "✗ android versionCode is $gradle_code, expected $want_code (digits of $tag)"; fail=1
          fi
          if [ "$fail" != 0 ]; then
            echo "Version drift detected: bump ALL platform version files before tagging $RELEASE_TAG"
            exit 1
          fi
          echo "All platform versions match $tag"

      - name: Validate app URL
        run: |
          test -n "$LAMBCHAT_APP_URL"
          case "$LAMBCHAT_APP_URL" in
            https://*) ;;
            *) echo "LAMBCHAT_APP_URL must be an https:// URL"; exit 1 ;;
          esac

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
        working-directory: frontend

      - name: Build and sync mobile web assets
        run: pnpm mobile:sync
        working-directory: frontend

      - name: Verify LambChat native brand assets
        run: pnpm brand:assets:check
        working-directory: frontend

      - name: Build Android APKs
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease assembleDebug
        working-directory: frontend/android

      - name: Prepare Android APK artifact
        id: android-artifact
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          mkdir -p release-assets
          unsigned_apk="frontend/android/app/build/outputs/apk/release/app-release-unsigned.apk"
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ] && [ -n "$ANDROID_KEY_ALIAS" ] && [ -n "$ANDROID_KEY_PASSWORD" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > release.keystore
            build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
            "$build_tools/apksigner" sign \
              --ks release.keystore \
              --ks-pass "pass:$ANDROID_KEYSTORE_PASSWORD" \
              --ks-key-alias "$ANDROID_KEY_ALIAS" \
              --key-pass "pass:$ANDROID_KEY_PASSWORD" \
              --out "release-assets/LambChat-android-${RELEASE_TAG}-signed.apk" \
              "$unsigned_apk"
            echo "has_artifact=true" >> "$GITHUB_OUTPUT"
          else
            debug_apk="frontend/android/app/build/outputs/apk/debug/app-debug.apk"
            cp "$debug_apk" "release-assets/LambChat-android-${RELEASE_TAG}-debug.apk"
            echo "Android signing secrets are not configured; uploading debug APK instead of signed release APK."
            echo "has_artifact=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload Android artifacts
        if: steps.android-artifact.outputs.has_artifact == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: LambChat-android-${{ env.RELEASE_TAG }}
          path: release-assets/*
          if-no-files-found: error

      # 即发即传：不等六端汇总（与 desktop job 同款创建竞态收敛）
      - name: Publish Android assets to release immediately
        if: steps.android-artifact.outputs.has_artifact == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for delay in 0 5 15; do
            if [ "$delay" -gt 0 ]; then sleep "$delay"; fi
            if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              break
            fi
            if gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" --title "LambChat $RELEASE_TAG" \
              --generate-notes >/dev/null 2>&1; then
              break
            fi
          done
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null
          gh release upload "$RELEASE_TAG" release-assets/* --clobber --repo "$GITHUB_REPOSITORY"

  ios:
    name: iOS
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 同 desktop/android job：版本漂移在打包前拦截
      - name: Preflight version consistency
        shell: bash
        run: |
          set -euo pipefail
          tag="${RELEASE_TAG#v}"
          pkg="$(node -p 'require("./frontend/package.json").version')"
          tauri="$(node -p 'JSON.parse(require("fs").readFileSync("frontend/src-tauri/tauri.conf.json","utf8")).version')"
          gradle_name="$(grep -E '^\s+versionName' frontend/android/app/build.gradle | sed -E 's/.*versionName "([^"]+)".*/\1/')"
          gradle_code="$(grep -E '^\s+versionCode' frontend/android/app/build.gradle | sed -E 's/.*versionCode ([0-9]+).*/\1/')"
          ios="$(grep -m1 'MARKETING_VERSION' frontend/ios/App/App.xcodeproj/project.pbxproj | sed -E 's/.*= ([^;]+);.*/\1/')"
          want_code="$(printf '%s' "$tag" | tr -d '.')"
          fail=0
          for entry in "frontend/package.json=$pkg" "tauri.conf.json=$tauri" "android versionName=$gradle_name" "iOS MARKETING_VERSION=$ios"; do
            k="${entry%%=*}"; v="${entry#*=}"
            if [ "$v" != "$tag" ]; then echo "✗ $k is $v, expected $tag"; fail=1; fi
          done
          if [ "$gradle_code" != "$want_code" ]; then
            echo "✗ android versionCode is $gradle_code, expected $want_code (digits of $tag)"; fail=1
          fi
          if [ "$fail" != 0 ]; then
            echo "Version drift detected: bump ALL platform version files before tagging $RELEASE_TAG"
            exit 1
          fi
          echo "All platform versions match $tag"

      - name: Validate app URL (optional)
        # app_url 可选：提供则构建期烘焙为默认服务器（VITE_API_BASE）；
        # 缺省打「运行时配置」包——安装后首启设置屏填 base_url 即可用。
        shell: bash
        run: |
          if [ -n "$LAMBCHAT_APP_URL" ]; then
            case "$LAMBCHAT_APP_URL" in
              https://*) ;;
              *) echo "LAMBCHAT_APP_URL must be an https:// URL"; exit 1 ;;
            esac
          else
            echo "LAMBCHAT_APP_URL not set: building runtime-configured package (first-run setup)"
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
        working-directory: frontend

      - name: Build and sync mobile web assets
        run: pnpm mobile:sync:ios
        working-directory: frontend

      - name: Install iOS pods
        run: pod install
        working-directory: frontend/ios/App

      - name: Verify LambChat native brand assets
        run: pnpm brand:assets:check
        working-directory: frontend

      - name: Build iOS archive without signing
        run: |
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination generic/platform=iOS \
            -archivePath "$RUNNER_TEMP/LambChat-ios.xcarchive" \
            -derivedDataPath "$RUNNER_TEMP/LambChatDerivedData" \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""
        working-directory: frontend/ios/App

      - name: Prepare iOS archive artifact
        run: |
          mkdir -p release-assets
          ditto -c -k --sequesterRsrc --keepParent \
            "$RUNNER_TEMP/LambChat-ios.xcarchive" \
            "release-assets/LambChat-ios-${RELEASE_TAG}-unsigned-xcarchive.zip"

      - name: Upload iOS archive artifact
        uses: actions/upload-artifact@v4
        with:
          name: LambChat-ios-${{ env.RELEASE_TAG }}
          path: release-assets/*
          if-no-files-found: error

      # 即发即传：不等六端汇总（与 desktop job 同款创建竞态收敛）
      - name: Publish iOS archive to release immediately
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for delay in 0 5 15; do
            if [ "$delay" -gt 0 ]; then sleep "$delay"; fi
            if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              break
            fi
            if gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" --title "LambChat $RELEASE_TAG" \
              --generate-notes >/dev/null 2>&1; then
              break
            fi
          done
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null
          gh release upload "$RELEASE_TAG" release-assets/* --clobber --repo "$GITHUB_REPOSITORY"

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs:
      - desktop
      - android
      - ios
    if: always()
    # 即发即传改造后本 job 的职责：① 权威重生成完整 latest.json（修复各
    # 平台增量合并的读-合-写竞态丢条目）；② 部分平台失败时的打捞重发
    # （needs + always()，资产已即时上传的 --clobber 原地替换幂等）。

    steps:
      # checkout 必须先于 artifact 下载：actions/checkout@v4.2+ 在 init 前
      # "Deleting the contents of <workspace>"——放下载之后会把已下载的
      # release-assets/ 整目录清掉（v0.2.0-rc1 首发实测：latest.json 步骤
      # ENOENT + 全平台 sig glob 落空）。
      - name: Checkout repository (app version for updater manifest)
        uses: actions/checkout@v4

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
        continue-on-error: true

      - name: Ensure release has useful installable artifacts
        run: |
          if [ ! -d release-assets ]; then
            echo "No release artifact directory was downloaded."
            exit 1
          fi
          find release-assets -type f -print
          test "$(find release-assets -type f | wc -l)" -gt 0

      - name: Generate latest.json updater manifest
        # Tauri v2 CLI 只产出 .sig 签名文件，不再自动生成更新清单（v1 行为已
        # 移除）；这里按平台 sig 组装 latest.json（端点见 tauri.conf.json
        # updater.endpoints）。版本取自 tag（preflight 已校验与各端版本文件
        # 一致）；macOS updater 走 .app.tar.gz，dmg 仅用于首装。
        env:
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: |
          python3 - <<'EOF'
          import datetime
          import glob
          import json
          import os
          import pathlib

          tag = os.environ["RELEASE_TAG"]
          base = f"https://github.com/Yanyutin753/LambChat/releases/download/{tag}"
          version = tag.lstrip("v")

          def sig(pattern: str) -> str | None:
              files = sorted(glob.glob(f"release-assets/{pattern}"))
              return pathlib.Path(files[0]).read_text().strip() if files else None

          mapping = [
              ("windows-x86_64", "*_x64_en-US.msi.sig", f"LambChat-{tag}-Windows.msi"),
              ("linux-x86_64", "*_amd64.AppImage.sig", f"LambChat-{tag}-Linux-x86_64.AppImage"),
              ("linux-aarch64", "*_aarch64.AppImage.sig", f"LambChat-{tag}-Linux-arm64.AppImage"),
              ("darwin-aarch64", "*.app.tar.gz.sig", f"LambChat-{tag}-macOS.app.tar.gz"),
          ]
          platforms = {}
          for key, pattern, asset in mapping:
              signature = sig(pattern)
              if signature:
                  platforms[key] = {"signature": signature, "url": f"{base}/{asset}"}
              else:
                  print(f"WARN: no sig file matches {pattern}, platform {key} omitted")

          manifest = {
              "version": version,
              "notes": f"LambChat {tag}",
              "pub_date": datetime.datetime.now(datetime.timezone.utc).strftime(
                  "%Y-%m-%dT%H:%M:%SZ"
              ),
              "platforms": platforms,
          }
          pathlib.Path("release-assets/latest.json").write_text(
              json.dumps(manifest, indent=2)
          )
          print(f"latest.json platforms: {sorted(platforms)}")
          EOF

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: LambChat ${{ env.RELEASE_TAG }}
          files: release-assets/*
          fail_on_unmatched_files: true
          generate_release_notes: true

      # macOS 安装引导：无 Apple 开发者证书只能 ad-hoc 签名，浏览器下载的
      # 未公证包首次打开会被 Gatekeeper 判「已损坏」。Release Notes 固定附
      # xattr 解法（与下载页 macOS 分区提示同一命令）；marker 保证重跑幂等。
      - name: Append macOS Gatekeeper install note
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json body -q .body > body.md || true
          if grep -q "macos-gatekeeper-note" body.md 2>/dev/null; then
            echo "Gatekeeper note already present; skip"
            exit 0
          fi
          cat >> body.md <<'NOTE'

          ---

          <!-- macos-gatekeeper-note -->
          ### macOS 安装提示 / macOS install note

          首次打开若提示「已损坏，无法打开」：将 LambChat 拖入「应用程序」文件夹后，
          打开「终端」执行 `xattr -cr /Applications/LambChat.app`，再启动即可。

          If macOS reports the app as damaged and cannot be opened on first launch:
          drag LambChat into your Applications folder, run
          `xattr -cr /Applications/LambChat.app` in Terminal, then launch it.
          NOTE
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --notes-file body.md
