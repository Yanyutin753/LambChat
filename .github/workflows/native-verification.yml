name: Native Desktop Verification

# Build-only: no tags, releases, signing credentials, updater files or deployments.
# The opt-in branch allows a first verification run without merging this workflow.
on:
  push:
    branches:
      - 'codex/native-verification/**'
  workflow_dispatch:
    inputs:
      expected_sha:
        description: 'Exact 40-character source commit to build from the selected codex branch'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: native-verification-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '10.32.1'
  CARGO_BUILD_JOBS: '1'
  RAYON_NUM_THREADS: '1'
  UV_CONCURRENT_DOWNLOADS: '1'
  UV_CONCURRENT_BUILDS: '1'
  UV_CONCURRENT_INSTALLS: '1'
  UV_FROZEN: 'true'
  LAMBCHAT_APP_URL: ''
  VITE_API_BASE: ''

jobs:
  windows:
    if: startsWith(github.ref, 'refs/heads/codex/')
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Require exact source commit
        shell: pwsh
        env:
          EXPECTED_SHA: ${{ github.event_name == 'push' && github.sha || inputs.expected_sha }}
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($env:EXPECTED_SHA -notmatch '^[0-9a-f]{40}$' -or $actual -cne $env:EXPECTED_SHA) {
            throw 'Selected branch does not match expected source commit'
          }

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Restore native compilation cache
        id: rust-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            frontend/src-tauri/target/release/deps
            frontend/src-tauri/target/release/build
            frontend/src-tauri/target/release/.fingerprint
            frontend/src-tauri/target/debug/deps
            frontend/src-tauri/target/debug/build
            frontend/src-tauri/target/debug/.fingerprint
          key: updater-verification-${{ runner.os }}-${{ hashFiles('frontend/src-tauri/Cargo.lock') }}-${{ github.sha }}
          restore-keys: updater-verification-${{ runner.os }}-${{ hashFiles('frontend/src-tauri/Cargo.lock') }}-

      - name: Setup uv
        uses: astral-sh/setup-uv@v4

      - name: Setup Python
        run: python scripts/run_validation.py uv python install 3.12

      - name: Verify Windows nested validation gate
        run: python scripts/run_validation.py python scripts/verify_windows_validation.py

      - name: Install frontend dependencies
        working-directory: frontend
        run: python ../scripts/run_validation.py cmd /d /s /c pnpm install --frozen-lockfile

      - name: Verify native brand assets
        working-directory: frontend
        run: python ../scripts/run_validation.py cmd /d /s /c pnpm brand:assets:check

      - name: Build current daemon sidecar
        shell: bash
        run: |
          daemon_build_bash="$(cygpath -w "$BASH")"
          python scripts/run_validation.py "$daemon_build_bash" client/scripts/build-daemon.sh

      - name: Fetch pinned embedded Python
        shell: bash
        run: python scripts/run_validation.py uv run --no-project --python 3.12 python client/scripts/fetch-pbs.py --platform windows-x86_64

      - name: Verify packaged Windows computer control
        run: python scripts/run_validation.py client/build/venv/Scripts/python.exe client/scripts/smoke-cua-windows.py --daemon frontend/src-tauri/binaries/lambchat-daemon-x86_64-pc-windows-msvc.exe --report-dir cua-verification-artifacts

      - name: Upload Windows computer control evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-cua-${{ github.run_id }}-${{ github.run_attempt }}
          path: cua-verification-artifacts/
          if-no-files-found: warn
          retention-days: 7

      - name: Configure isolated test application identity
        shell: pwsh
        run: |
          $suffix = "r$env:GITHUB_RUN_ID-a$env:GITHUB_RUN_ATTEMPT"
          $identifier = "com.lambchat.verification.$suffix"
          $config = @{
            productName = "LambChat Verify $suffix"
            identifier = $identifier
            mainBinaryName = "lambchat-verify-$suffix"
            bundle = @{ createUpdaterArtifacts = $false; targets = @('nsis') }
            plugins = @{ updater = @{ endpoints = @() } }
          }
          $config | ConvertTo-Json -Depth 8 | Set-Content frontend/src-tauri/verification.conf.json -Encoding utf8
          New-Item -ItemType Directory verification-artifacts | Out-Null
          @{
            source_sha = (git rev-parse HEAD).Trim()
            source_ref = $env:GITHUB_REF
            workflow_run = $env:GITHUB_RUN_ID
            workflow_attempt = $env:GITHUB_RUN_ATTEMPT
            identifier = $identifier
            product_name = $config.productName
            main_binary_name = $config.mainBinaryName
            executable_name = "$($config.mainBinaryName).exe"
            signed = $false
            released = $false
            updater_artifacts = $false
          } | ConvertTo-Json | Set-Content verification-artifacts/provenance.json -Encoding utf8

      - name: Generate icons and build isolated unsigned NSIS
        working-directory: frontend
        shell: pwsh
        run: |
          python ../scripts/run_validation.py cmd /d /s /c pnpm dlx @tauri-apps/cli@2.12.3 icon resources/native-icon.png
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python ../scripts/run_validation.py cmd /d /s /c pnpm dlx @tauri-apps/cli@2.12.3 build --ci --no-sign --bundles nsis --config src-tauri/verification.conf.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --exit-code -- pnpm-lock.yaml src-tauri/Cargo.lock ../uv.lock
          if ($LASTEXITCODE -ne 0) { throw 'Build changed a dependency lockfile' }

      - name: Build native desktop control acceptance fixture
        shell: pwsh
        run: |
          python scripts/run_validation.py cargo build --manifest-path frontend/src-tauri/Cargo.toml --release --locked --jobs 1 --example desktop_control_smoke --features tauri/custom-protocol
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item frontend/src-tauri/target/release/examples/desktop_control_smoke.exe verification-artifacts/

      - name: Native updater version-binding regression
        shell: pwsh
        env:
          CARGO_PROFILE_DEV_DEBUG: "0"
        run: |
          python scripts/run_validation.py cargo test --manifest-path frontend/src-tauri/Cargo.toml --package lambchat-updater-verifier --profile dev --locked --bin verify_updater --jobs 1 -- --test-threads=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/run_validation.py cargo build --manifest-path frontend/src-tauri/Cargo.toml --package lambchat-updater-verifier --profile dev --locked --bin verify_updater --jobs 1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path scripts/test_windows_native_update.ps1), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { throw ($errors | Out-String) }

      - name: Collect installer and content hashes
        if: always() && hashFiles('frontend/src-tauri/target/release/bundle/nsis/*-setup.exe') != ''
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem frontend/src-tauri/target/release/bundle/nsis -Filter '*-setup.exe')
          if ($installers.Count -ne 1) { throw 'Expected exactly one test NSIS installer' }
          Copy-Item $installers[0].FullName verification-artifacts/
          Copy-Item frontend/src-tauri/verification.conf.json verification-artifacts/
          Get-ChildItem frontend/src-tauri/target/debug -Filter 'verify_updater.exe' -ErrorAction SilentlyContinue |
            Copy-Item -Destination verification-artifacts/
          Get-ChildItem verification-artifacts -File | Get-FileHash -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $([IO.Path]::GetFileName($_.Path))" } |
            Set-Content verification-artifacts/SHA256SUMS -Encoding utf8

      - name: Upload verification artifact
        if: always() && hashFiles('verification-artifacts/provenance.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: windows-native-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: verification-artifacts/
          if-no-files-found: error
          retention-days: 7

      - name: Save native compilation cache
        if: always() && steps.rust-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            frontend/src-tauri/target/release/deps
            frontend/src-tauri/target/release/build
            frontend/src-tauri/target/release/.fingerprint
            frontend/src-tauri/target/debug/deps
            frontend/src-tauri/target/debug/build
            frontend/src-tauri/target/debug/.fingerprint
          key: updater-verification-${{ runner.os }}-${{ hashFiles('frontend/src-tauri/Cargo.lock') }}-${{ github.sha }}

  linux-capture:
    if: startsWith(github.ref, 'refs/heads/codex/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install X11 capture fixture dependencies
        run: sudo apt-get update && sudo apt-get install -y python3-xlib python3-pil xvfb xauth
      - name: Verify overlay-free native window pixels
        run: |
          python3 scripts/run_validation.py env PYTHONPATH=client xvfb-run -a python3 scripts/release_tests/linux_capture_smoke.py
          python3 scripts/run_validation.py env PYTHONPATH=client xvfb-run -a python3 scripts/release_tests/linux_capture_smoke.py --unredirected

  desktop-control:
    if: startsWith(github.ref, 'refs/heads/codex/')
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, macos-15, macos-15-intel, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf xvfb xauth
      - name: Install and build toolbar frontend
        if: runner.os != 'Windows'
        shell: bash
        run: |
          python3 scripts/run_validation.py pnpm --dir frontend install --frozen-lockfile
          python3 scripts/run_validation.py pnpm --dir frontend run build
      - name: Install and build Windows toolbar frontend
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python scripts/run_validation.py cmd /d /s /c pnpm --dir frontend install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/run_validation.py cmd /d /s /c pnpm --dir frontend run build
      - name: Generate native icons
        if: runner.os != 'Windows'
        working-directory: frontend
        shell: bash
        run: python3 ../scripts/run_validation.py pnpm dlx @tauri-apps/cli@2.12.3 icon resources/native-icon.png
      - name: Generate Windows native icons
        if: runner.os == 'Windows'
        working-directory: frontend
        shell: pwsh
        run: python ../scripts/run_validation.py cmd /d /s /c pnpm dlx @tauri-apps/cli@2.12.3 icon resources/native-icon.png
      - name: Build isolated native toolbar
        shell: bash
        env:
          TAURI_CONFIG: '{"bundle":{"externalBin":[],"resources":[]}}'
        run: python3 scripts/run_validation.py cargo build --manifest-path frontend/src-tauri/Cargo.toml --locked --jobs 1 --example desktop_control_smoke --features tauri/custom-protocol
      - name: Verify native pause and resume
        shell: bash
        env:
          LAMBCHAT_CONTROL_AUTOMATED: '1'
        run: |
          export LAMBCHAT_CONTROL_TEST_ROOT="$GITHUB_WORKSPACE"
          export LAMBCHAT_CONTROL_TEST_PYTHON="$(python3 -c 'import sys; print(sys.executable)')"
          binary=frontend/src-tauri/target/debug/examples/desktop_control_smoke
          if [ "$RUNNER_OS" = Windows ]; then binary="$binary.exe"; fi
          if [ "$RUNNER_OS" = Linux ]; then
            python3 scripts/run_validation.py env GDK_BACKEND=x11 LIBGL_ALWAYS_SOFTWARE=1 dbus-run-session -- xvfb-run -a "$binary" 2>&1 | tee desktop-control.log
          else
            python3 scripts/run_validation.py "$binary" 2>&1 | tee desktop-control.log
          fi
          grep -q '"ok":true' desktop-control.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-control-${{ matrix.os }}-${{ github.run_id }}
          path: |
            desktop-control.log
            frontend/src-tauri/target/debug/examples/desktop_control_smoke
            frontend/src-tauri/target/debug/examples/desktop_control_smoke.exe
          if-no-files-found: warn
