name: Windows Updater Diagnosis

on:
  push:
    branches:
      - 'codex/updater-diagnostics/**'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Download previously verified native verifier
        shell: pwsh
        run: |
          gh run download 39416722709 --repo $env:GITHUB_REPOSITORY --name windows-updater-diagnosis-39416722709 --dir diagnostic/helper
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Compare packaged and portable executable bytes
        shell: pwsh
        run: |
          foreach ($tag in @('v2.15.2','v2.15.3-dev.1')) {
            $dir = "diagnostic/$tag"
            New-Item -ItemType Directory -Force $dir | Out-Null
            gh release download $tag --repo $env:GITHUB_REPOSITORY --pattern '*Windows-x64-setup.exe' --pattern '*_x64-setup.exe.sig' --pattern '*Windows-Portable.zip' --dir $dir
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            Expand-Archive "$dir/*Windows-Portable.zip" "$dir/portable"
            $setup = Get-ChildItem $dir -Filter '*Windows-x64-setup.exe' | Select-Object -First 1
            & 7z x $setup.FullName "-o$dir/unpacked" lambchat.exe -r -y
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            Get-ChildItem $dir -Recurse -Filter lambchat.exe | Get-FileHash -Algorithm SHA256 | Format-List
          }
      - name: Replay upgrade against the actual packaged executable
        shell: pwsh
        run: |
          $dir = 'diagnostic/v2.15.3-dev.1'
          $candidate = Get-ChildItem $dir -Filter '*Windows-x64-setup.exe' | Select-Object -First 1
          $signature = Get-ChildItem $dir -Filter '*_x64-setup.exe.sig' | Select-Object -First 1
          Copy-Item $signature.FullName "$($candidate.FullName).sig"
          $exe = @(Get-ChildItem "$dir/unpacked" -Recurse -Filter lambchat.exe)
          if ($exe.Count -ne 1) { throw 'Expected one packaged application executable' }
          $regression = (Get-Content scripts/test_windows_native_update.ps1 -Raw).Replace("@('v2.15.2', 'v2.15.3-dev.1')", "@('v2.15.2')")
          Set-Content diagnostic/test_windows_native_update.ps1 $regression
          Register-CimIndicationEvent -ClassName Win32_ProcessStopTrace -SourceIdentifier InstallerStop | Out-Null
          try {
            # dev.1 genuinely signed its core version; keep its real signature intact.
            python scripts/run_validation.py pwsh -NoProfile -File diagnostic/test_windows_native_update.ps1 -Verifier diagnostic/helper/target/release/updater-diagnosis.exe -Artifact $candidate.FullName -Version 2.15.3 -ExpectedExe ($exe[0].FullName)
            $result = $LASTEXITCODE
          } finally {
            Get-Event -SourceIdentifier InstallerStop -ErrorAction SilentlyContinue | ForEach-Object {
              $event = $_.SourceEventArgs.NewEvent
              if ($event.ProcessName -match 'installer|uninstall|powershell') {
                Write-Output "Installer exit: $($event.ProcessName) pid=$($event.ProcessID) status=$($event.ExitStatus)"
              }
            }
            Unregister-Event -SourceIdentifier InstallerStop
          }
          exit $result
